# ──────────────────────────────────────────────────────────────
# Configuration for residual encoding visualization
# See: cross_modal_neural_encoding/visualization/visualize_residual_encoding.py
# ──────────────────────────────────────────────────────────────

# Root holding the residual outputs (<model>/{summary,aggregated}.csv).
residual_root: "outputs/residual_encoding"

# Root holding the standard neural-encoding outputs, searched per model for
# the matching <model>/summary.csv (used for the residualized − standard delta).
encoding_root: "outputs/neural_encoding"

# Which side was residualized: "embedding" or "fmri". Drives the figure titles
# and the residual x-tick labels. When null it is inferred from residual_root
# (a name containing "fmri" → fMRI-based, otherwise embedding-based).
residual_side: null

# Metric column from the summary CSV to plot.
metric: "mean_normalized_r"

# Output directory for the two combined figures.
output_dir: "reports/figures/residual_encoding"

# ── 2x2 condition matrix (embedding modality x fMRI modality) ─
# Same layout as the main encoding figure: rows = embedding modality, columns =
# fMRI modality, with the six pairwise condition comparisons as connectors in
# the gutters between panels rather than brackets stacked above the bars.
plot_condition_matrix: true
condition_matrix_figsize: [15.0, 8.8]
condition_matrix_font_scale: 1.45
# null = auto-scale to the data, shared across all four panels. Residualized
# accuracies go negative, so the range is not anchored at zero.
condition_matrix_y_limits: null
